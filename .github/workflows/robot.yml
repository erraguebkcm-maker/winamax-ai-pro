name: Robot WINAMAX AI PRO
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: robot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Installation du projet (premier lancement)
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          if [ -f winamax_ai_pro.zip ]; then
            unzip -q -o winamax_ai_pro.zip -x 'winamax_ai_pro/.github/*'
            cp -r winamax_ai_pro/. .
            rm -rf winamax_ai_pro winamax_ai_pro.zip
            git add -A
            git commit -m "Installation du projet"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests automatiques
        run: python -m unittest -v
      - name: Journee de travail du robot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python robot.py
      - name: Sauvegarde
        run: |
          git add data output/report.json output/rapport_*.md
          git commit -m "Robot : journee du $(date +%F)" || echo "Rien a sauvegarder"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - id: deploy
        uses: actions/deploy-pages@v4
